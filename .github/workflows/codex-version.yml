name: Codex client version

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-client-version
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare with the latest stable Codex release
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_codex_version.py

      - name: Test
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run version-sensitive tests
        if: steps.version.outputs.changed == 'true'
        run: go test ./internal/oauth ./internal/gateway

      - name: Commit the new client version
        if: steps.version.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/oauth/oauth.go README.md
          git commit -m "Update Codex client version to ${{ steps.version.outputs.version }}"
          git push
